  <circle cx="100" cy="100" r="96" fill="#D9EFE4"/>
  <!-- Sikl halqasi -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="#FFFFFF" stroke-width="20"/>
  <!-- Unumdor oyna — halqaning bir bo'lagi -->
  <path d="M100 36a64 64 0 0 1 55 32" fill="none" stroke="#3FA37A" stroke-width="20" stroke-linecap="round"/>
  <!-- Ovulyatsiya kuni -->
  <circle cx="155" cy="68" r="14" fill="#2E7D5B"/>
  <circle cx="155" cy="68" r="5" fill="#FFFFFF"/>
  <!-- Markazda tuxum hujayra -->
