name: CI

# Roadmap 19-band: avtomatlashtirilgan test. Har push/PR'da typecheck +
# unit testlar avtomatik ishga tushadi — endi kod xatosi (masalan
# predictCycle'dagi kechikish bugi kabi) e'tiborsiz qolib ketmaydi.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint --workspace=apps/web
      - run: npm run lint --workspace=apps/mobile
