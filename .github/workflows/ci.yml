name: CI

# Roadmap 19-band: avtomatlashtirilgan test. Har push/PR'da typecheck +
# unit testlar avtomatik ishga tushadi — endi kod xatosi (masalan
# predictCycle'dagi kechikish bugi kabi) e'tiborsiz qolib ketmaydi.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    # QA-001: sikl API'sining bazaga YOZISH mantig'ini (CYCLE-001 aynan shu
    # qatlamda yashiringan edi) tekshirish uchun vaqtinchalik Postgres —
    # har CI ishga tushishida bo'sh boshlanadi, productionga hech qanday
    # aloqasi yo'q, ish tugagach butunlay yo'q qilinadi.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mammoai
          POSTGRES_PASSWORD: mammoai
          POSTGRES_DB: mammoai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint --workspace=apps/web
      - name: Integration tests (cycle API, real Postgres)
        run: npm run test:integration --workspace=apps/web
        env:
          DATABASE_URL: postgresql://mammoai:mammoai@localhost:5432/mammoai_ci

  # DEPLOY-02: `main`ga tushgan o'zgarishni Vercel'da deploy qilish.
  #
  # Nega kerak: Vercel loyihasi HOBBY (shaxsiy) rejada. Bu rejada faqat loyiha
  # EGASINING git push'lari deploy'ni ishga tushiradi — boshqa hamkorning
  # commitlari e'tiborsiz qoladi. 2026-09-22 da aynan shu holat bo'ldi: yetti
  # ta commit `main`ga tushdi, GitHub Actions ularni tekshirdi va o'tkazdi,
  # lekin production 18 soat oldingi kodni ko'rsatishda davom etdi va sababini
  # tashqaridan bilish imkoni yo'q edi.
  #
  # Deploy Hook bu cheklovga bog'liq emas: u oddiy POST so'rov, kim push
  # qilganidan qat'i nazar ishlaydi. Natijada deploy KO'RINADIGAN bo'ladi —
  # GitHub Actions'da yashil/qizil belgi sifatida.
  #
  # Sozlash (bir marta):
  #   1. Vercel → loyiha → Settings → Git → Deploy Hooks → "Create Hook"
  #      (nomi: main, shoxi: main) → URL nusxalanadi;
  #   2. GitHub → repo → Settings → Secrets and variables → Actions →
  #      "New repository secret" → nomi VERCEL_DEPLOY_HOOK, qiymati o'sha URL.
  #
  # Secret qo'yilmaguncha bu qadam shunchaki o'tkazib yuboriladi — CI yiqilmaydi.
  deploy:
    needs: typecheck-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Vercel deploy'ni ishga tushirish
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret'i yo'q — deploy o'tkazib yuborildi."
            echo "Sozlash yo'riqnomasi shu faylning yuqorisidagi izohda."
            exit 0
          fi
          echo "Deploy hook chaqirilmoqda..."
          curl -fsS -X POST "$HOOK" | head -c 400
          echo
          echo "Ishga tushdi. Vercel → Deployments bo'limida kuzating."
